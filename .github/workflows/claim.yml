name: Epic Games Freebies Claimer

on:
  schedule:
    - cron: '30 0 * * 5'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create device_auths.json from Secret
        run: |
          mkdir -p data
          echo '${{ secrets.DEVICE_AUTHS }}' > data/device_auths.json

      - name: Run Claimer and Save Log
        id: run_claimer
        continue-on-error: true
        run: |
          node claimer.js > log.txt 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          cat log.txt
          exit $EXIT_CODE

      - name: Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXIT_CODE: ${{ env.EXIT_CODE }}
        run: |
          python3 -c '
          import os, json, re, urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          exit_code = os.environ.get("EXIT_CODE", "0")
          
          log_content = ""
          if os.path.exists("log.txt"):
              with open("log.txt", "r", encoding="utf-8", errors="ignore") as f:
                  log_content = f.read()

          msg = "🎮 **Epic Games 自動領取報告**\n"

          if exit_code != "0":
              lines = [l.strip() for l in log_content.splitlines() if l.strip()]
              err_tail = "\n".join(lines[-3:]) if lines else "無日誌內容"
              msg += f"❌ **執行發生異常！呱！菈菈救我！ **\n```\n{err_tail}\n```\n請至 GitHub Actions 檢查帳號授權或日誌。"
          elif re.search(r"Claimed|Successfully", log_content, re.I):
              claimed = [l for l in log_content.splitlines() if re.search(r"Claimed|Successfully", l, re.I)]
              details = "\n".join(claimed[:5])
              msg += f"✅ **領取成功！**\n```\n{details}\n```已收入囊中。本週的消費由O公子買單（已消費0元）"
          else:
              msg += "ℹ️ **檢查過庫存了，皆為已有之物...想吃河豚了**"

          if webhook_url:
              data = json.dumps({"content": msg}).encode("utf-8")
              req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req) as response:
                      print(f"Discord 通知發送成功 (Status: {response.status})")
              except Exception as e:
                  print(f"發送 Discord 通知失敗: {e}")
          '

name: Epic Games Freebies Claimer

on:
  schedule:
    - cron: '30 0 * * 5'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create device_auths.json from Secret
        run: |
          mkdir -p data
          echo '${{ secrets.DEVICE_AUTHS }}' > data/device_auths.json

      - name: Run Claimer and Save Log
        id: run_claimer
        continue-on-error: true
        run: |
          # 手動寫入模擬的錯誤訊息，並設定 Exit Code 為 1 (代表失敗)
          echo "2026-10-18 | ERROR | Mock authentication failure exception" > log.txt
          exit 1

      - name: Send Discord Notification
        if: always()
        run: |
          MSG="🎮 **Epic Games 自動領取報告**\n"
          
          # 檢查 exit code 是否不為 0 (確保中括號前後都有空格)
          if [ "${{ env.EXIT_CODE }}" != "0" ]; then
            ERROR_DETAILS=$(tail -n 3 log.txt)
            MSG="${MSG}❌ **執行發生異常！**\n\`\`\`\n${ERROR_DETAILS}\n\`\`\`\n請至 GitHub Actions 檢查帳號授權或日誌。"
          elif grep -q -i "Claimed" log.txt || grep -q -i "Successfully" log.txt; then
            DETAILS=$(grep -i -E "Claimed|Successfully" log.txt | head -n 5)
            MSG="${MSG}✅ **領取成功！**\n\`\`\`\n${DETAILS}\n\`\`\`"
          else
            MSG="${MSG}ℹ️ **當前無新遊戲可領取或皆已擁有。**"
          fi

          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"${MSG}\"}" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"

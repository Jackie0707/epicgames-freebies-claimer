name: Epic Games Freebies Claimer

on:
  schedule:
    - cron: '30 0 * * 5'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create device_auths.json from Secret
        run: |
          mkdir -p data
          echo '${{ secrets.DEVICE_AUTHS }}' > data/device_auths.json

      - name: Run Claimer
        run: node claimer.js

      - name: Send Discord Notification
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "🎮 Epic Games Freebies 領取工作流已執行完畢！"}' \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"

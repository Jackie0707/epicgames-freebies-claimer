name: Epic Games Freebies Claimer

on:
  schedule:
    - cron: '30 0 * * 5'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create device_auths.json from Secret
        run: |
          mkdir -p data
          echo '${{ secrets.DEVICE_AUTHS }}' > data/device_auths.json

      - name: Run Claimer and Save Log
        id: run_claimer
        continue-on-error: true
        run: |
          # 記錄執行結果
          node claimer.js > log.txt 2>&1
          EXIT_CODE=$?
          cat log.txt
          exit $EXIT_CODE

      - name: Send Discord Notification
        if: always()
        run: |
          LOG_CONTENT=$(cat log.txt)
          MSG="🎮 **Epic Games 自動領取報告**\n"
          
          # 檢查是否有錯誤發生 (Error, Failed, Exception 或退出代碼非 0)
          if grep -q -i "error" log.txt || grep -q -i "fail" log.txt || grep -q -i "exception" log.txt; then
            ERROR_DETAILS=$(grep -i -E "error|fail|exception" log.txt | head -n 3)
            MSG="${MSG}❌ **執行發生異常！**\n\`\`\`\n${ERROR_DETAILS}\n\`\`\`\n請至 GitHub Actions 檢查帳號授權或日誌。"
          elif grep -q -i "Claimed" log.txt || grep -q -i "Successfully" log.txt; then
            DETAILS=$(grep -i -E "Claimed|Successfully" log.txt | head -n 5)
            MSG="${MSG}✅ **領取成功！**\n\`\`\`\n${DETAILS}\n\`\`\`"
          elif grep -q -i "No free" log.txt || grep -q -i "already" log.txt || grep -q -i "owned" log.txt; then
            MSG="${MSG}ℹ️ 檢查完畢：當前無新遊戲可領取或皆已擁有。"
          else
            MSG="${MSG}🚀 腳本執行完畢，狀態正常。"
          fi

          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"${MSG}\"}" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"
